<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <link rel="icon" href="/favicon.ico?v=point-top" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=point-top" />
    <title>Open Net Worth</title>

    <!-- PWA: installable + offline app-shell -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <meta name="theme-color" content="#0e1014" />
    <!-- Pre-paint background. The theme stamp below sets data-theme before paint, but the
         actual background colour lives in the CSS BUNDLE, which arrives later — so the very
         first paint used the browser default (WHITE) and every cold start flashed white
         before going dark. Invisible on desktop; on an iOS standalone PWA, where the app is
         destroyed on backgrounding and every reopen is a cold start, it read as "the app
         flashes white and refreshes itself" (2026-07-27).
         Inline so it needs no network. Literals mirror src/theme.ts's --bg — keep in sync
         with the theme-color values in the script below. -->
    <style>
      html {
        background: #0e1014;
      }
      html[data-theme='warm'] {
        background: #edeae3;
      }
      html[data-theme='light'] {
        background: #ffffff;
      }
      body {
        background: inherit;
      }
      /* iOS 27 tints the `default` status bar from the background-color of the element at
         the very top of the page; it has to be a real element (a pseudo-element is invisible
         to the sampler). Inherits the theme background above. */
      #status-bar-sampler {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 1px;
        z-index: 2147483647;
        pointer-events: none;
        background: inherit;
      }
    </style>
    <!-- Pre-paint theme stamp: resolve the persisted palette preference
         before any stylesheet applies, so a reload never flashes the wrong theme.
         Mirrors src/theme.ts (storage key + the three --bg literals) — keep in sync.
         An external file, not inline: the page's CSP allows no inline script. -->
    <script src="/theme-stamp.js"></script>
    <!-- iOS standalone (add-to-home-screen) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- `default`, not `black-translucent`: since iOS 27 beta 5 a translucent status bar gets
         a progressive blur drawn over the top edge of the app. The value is frozen when the
         app is added to the Home Screen, so an existing shortcut must be re-added. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Net Worth" />
    <!-- Inlined as a data: URI by vite.config.ts (inlineAppleTouchIcon). iOS 27 ignores a
         URL-referenced touch icon and shows a letter tile; an inline one still works. -->
    <link rel="apple-touch-icon" sizes="180x180" href="%APPLE_TOUCH_ICON%" />
  </head>
  <body>
    <div id="status-bar-sampler" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
