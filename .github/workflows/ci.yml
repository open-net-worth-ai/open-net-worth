name: CI

# Guardrail gates for Open Net Worth (P0-E2). Mirrors `make check`:
#   lint -> type -> test -> build
# Backend tooling config lives in pyproject.toml; deps come from
# requirements.txt + requirements-dev.txt.
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # --- privacy: no secret, personal or financial data may enter the repo (must be green) ---
  # The pre-commit hook runs the same checks locally, but a hook can be skipped (`--no-verify`,
  # plumbing commits, a cloud agent's fresh clone, a web edit). This job cannot: it scans
  # exactly the commits a PR or push adds. PRIVACY_DENYLIST (the owner's own identifiers) is
  # an encrypted secret, never a file in the repo; findings name its entries by number only,
  # so this log stays safe on a public repo. A fork PR gets no secrets: the file, path and
  # secret rules still run. See backend/scripts/privacy_guard.py.
  privacy:
    name: privacy (secrets + personal data)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Commit range under review
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "range=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.before }}" ] && ! echo "${{ github.event.before }}" | grep -qE '^0+$'; then
            echo "range=${{ github.event.before }}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "range=${{ github.sha }}~1..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      - name: gitleaks (secrets in the added commits)
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --no-banner --redact --log-opts="${{ steps.range.outputs.range }}" .
      - name: pii-lint (ID, phone, bank-account and card shapes, whole tree)
        run: python -m backend.scripts.pii_lint
      - name: privacy guard (data files, screenshots, local paths, private denylist)
        env:
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
        run: python -m backend.scripts.privacy_guard --range "${{ steps.range.outputs.range }}"

  # --- lint: ruff check + ruff format --check (must be green) ---
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .
      # Enforce the dependency rule (api/ai -> services -> db -> core). Contracts
      # in pyproject.toml [tool.importlinter]; exits non-zero on any broken
      # contract → fails the (hard-gate) lint job. See P1-A6.
      - name: import-linter (dependency rule)
        run: lint-imports
      # Enforce the tool-naming rules (entity-set arrays must be named plural at BOTH
      # the tool and the parameter — a singular name that accepts a list primes the model
      # to stringify it). Rules + reviewed exemptions in backend/scripts/tool_inventory.py;
      # exits non-zero on any defect → fails the (hard-gate) lint job.
      #
      # This step exists because `make lint` runs the linter but CI does NOT run `make lint`
      # — it inlines each check as its own step. Without this, a PR introducing a naming
      # defect goes green here and is caught only if someone runs make locally. That is the
      # difference between "currently true" and "enforced", and this class of defect has
      # been re-introduced repeatedly.
      - name: tool naming rules
        run: python -m backend.scripts.tool_inventory --lint
      # Corpus lint for docs/product/**/*.md (frontmatter schema, category/directory
      # match, duplicate order, H1 presence/match, cross-links). services/product_docs.py
      # fails closed for the WHOLE Help feature on any single bad file, and nothing
      # handles that error in api/product_docs.py or main.py — so a bad page merged
      # green here was previously an unhandled 500 in production, caught only if
      # someone ran `make docs-lint` by hand. Mirrors the `docs-lint` target in Makefile.
      - name: docs corpus lint
        run: python -m backend.scripts.docs_lint

  # --- type: mypy backend (must be green); frontend tsc (must be green) ---
  type:
    name: type (mypy + tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: mypy backend
        run: mypy backend

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci (frontend)
        working-directory: frontend
        run: npm ci
      # BLOCKING since the P2-FE1 burn-down (0 errors). `vite build` strips
      # types without checking — this is the only frontend type gate.
      - name: frontend typecheck
        working-directory: frontend
        run: npm run typecheck

  # --- test: fast pytest gate (integration suite excluded) ---
  test:
    name: test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: pytest (not integration)
        run: python3 -m pytest -q -m "not integration"

  # --- test-windows: the backend imports and the Windows-ported areas pass on windows-latest.
  # The focused list is every area with platform-specific code (locks, process trees, anchored
  # directory access, the sandbox, autostart, instance claim, desktop bootstrap). The full suite
  # runs after it as information: it was written on POSIX, and its remaining failures are tracked
  # in docs/WINDOWS.md rather than hidden.
  test-windows:
    name: test (windows, focused)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e . --no-deps
      - name: Import smoke (isolated root)
        env:
          ONW_ROOT: ${{ runner.temp }}/onw-smoke
          ONW_QA_MODE: "1"
        run: python -c "import backend.main; print('IMPORT_OK')"
      - name: Focused tests
        run: >
          python -m pytest -q -p no:randomly -m "not integration"
          tests/test_file_lock.py tests/test_process_tree.py tests/test_anchored_dir.py
          tests/test_core_io.py tests/test_instance_lock.py tests/test_desktop_launch.py
          tests/test_desktop_file.py tests/test_sandbox.py tests/test_run_source.py
          tests/test_run_code_tool.py tests/test_mcp_client.py tests/test_autostart.py
          tests/test_skill_store.py tests/test_skill_bundles.py tests/test_skills_service.py
          tests/test_desktop_runtime_build.py
      - name: Full suite (informational)
        if: always()
        continue-on-error: true
        run: python -m pytest -q -p no:randomly -m "not integration" --no-header -rfE tests

  # --- db: the ENTIRE tests/db suite again, against real Postgres. This is the
  # second-dialect gate (spec 2026-08-05 D1): any SQLite-only SQL fails here,
  # in CI, instead of during a hosted launch. SQLite coverage comes free — the
  # main `test` job already runs tests/db with the default sqlite URL.
  db-postgres:
    name: db (postgres dialect)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: onw
          POSTGRES_PASSWORD: onw
          POSTGRES_DB: onw_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U onw"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ONW_TEST_DATABASE_URL: postgresql+psycopg://onw:onw@localhost:5432/onw_test
      ONW_MIGRATE_ASSUME_BACKUP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: DB suite and market-data locking on Postgres
        run: python -m pytest tests/db tests/test_market_data_stores.py -q -p no:randomly

  # --- integration: opt-in, gated on a secret, allowed to fail ---
  # The integration suite hits real LLM/market APIs (~8 min). It only runs when
  # an ANTHROPIC_API_KEY repo secret is present and never blocks the merge.
  integration:
    name: test (integration, opt-in)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: pytest (integration)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # Skip cleanly when no key is configured rather than erroring.
        run: |
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "ANTHROPIC_API_KEY not set — skipping integration suite."
            exit 0
          fi
          python3 -m pytest -q -m "integration"

  # --- build: frontend production build (vite build, exits) ---
  build:
    name: build (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci && npm run build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  # --- package: the wheel a user installs is self-contained. Build it, install it into a
  # clean environment (no checkout on sys.path), boot `onw start` from it on an isolated
  # scratch root, and hit the API, the SPA and the docs. This is the evidence behind
  # `uv tool install open-net-worth`; nothing else in CI exercises the packaged form.
  package:
    name: package (wheel installs + serves)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Build frontend + embedded docs site
        run: |
          (cd frontend && npm ci && npm run build)
          (cd docs-site && npm ci && npm run build:embed)
      - name: Bundle shipped assets + build the wheel
        run: |
          python3 scripts/bundle_assets.py
          uv build --wheel
      - name: Install the wheel into a clean environment
        run: |
          uv venv --python "$PYTHON_VERSION" "$RUNNER_TEMP/onw-venv"
          uv pip install --python "$RUNNER_TEMP/onw-venv/bin/python" dist/*.whl
      - name: Boot from the wheel and probe it
        # Run from OUTSIDE the checkout so nothing can resolve to repo files by accident.
        working-directory: ${{ runner.temp }}
        env:
          ONW_ROOT: ${{ runner.temp }}/onw-root
          ONW_QA_MODE: "1"
          PORT: "8097"
        run: |
          ONW="$RUNNER_TEMP/onw-venv/bin/onw"
          "$ONW" version | tee /dev/stderr | grep -Eq '^open-net-worth [0-9]'
          "$ONW" start > "$RUNNER_TEMP/onw.log" 2>&1 &
          for _ in $(seq 1 90); do
            curl -fsS "http://127.0.0.1:$PORT/api/health" >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS "http://127.0.0.1:$PORT/api/health" | grep -q '"version"'
          curl -fsS "http://127.0.0.1:$PORT/" | grep -q 'id="root"'
          curl -fsS "http://127.0.0.1:$PORT/docs/" | grep -qi '<html'
          kill %1
      - name: Server log (on failure)
        if: failure()
        run: cat "$RUNNER_TEMP/onw.log" || true
