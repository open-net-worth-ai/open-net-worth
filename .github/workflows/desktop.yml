name: Desktop

on:
  pull_request:
    paths: ['desktop/**', 'backend/**', 'frontend/**', 'scripts/build_desktop_runtime.py', 'scripts/install.ps1', 'scripts/install.Tests.ps1', 'requirements.txt', 'pyproject.toml', '.github/workflows/desktop.yml']
  push:
    branches: [main]
    paths: ['desktop/**', 'backend/**', 'frontend/**', 'scripts/build_desktop_runtime.py', 'scripts/install.ps1', 'scripts/install.Tests.ps1', 'requirements.txt', 'pyproject.toml', '.github/workflows/desktop.yml']
  workflow_dispatch:
    inputs:
      signed:
        description: Sign and notarize using the desktop-release environment
        type: boolean
        default: false
  workflow_call:
    inputs:
      signed:
        description: Sign and notarize using the desktop-release environment
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    environment: desktop-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            frontend/package-lock.json
            docs-site/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install and check desktop host
        run: |
          # The watched-folder helper tests run the real backend.cli.desktop_file under this python.
          python3 -m pip install -r requirements.txt
          export ONW_DESKTOP_PYTHON="$(command -v python3)"
          cd desktop
          npm ci
          npm run typecheck
          npm test
      - name: Build relocatable runtime
        run: python3 scripts/build_desktop_runtime.py
      - name: Exercise Electron with bundled runtime and disposable book
        # Runs for signed (release) builds too: a release re-proves the exact commit it ships.
        run: |
          cd desktop
          npm run build
          ONW_DESKTOP_RUNTIME="$PWD/runtime" npm run e2e
          ONW_DESKTOP_RUNTIME="$PWD/runtime" node qa/default-book.mjs
          ONW_DESKTOP_RUNTIME="$PWD/runtime" node qa/book-picker.mjs
          ONW_DESKTOP_RUNTIME="$PWD/runtime" node qa/close.mjs
          npx playwright install chromium
          ONW_DESKTOP_RUNTIME="$PWD/runtime" node qa/browser.mjs
          node qa/server-client.mjs
      - name: Install signing identity
        if: inputs.signed == true
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          test -n "$CERTIFICATE" && test -n "$CERTIFICATE_PASSWORD" && test -n "$KEYCHAIN_PASSWORD"
          test -n "$APPLE_ID" && test -n "$APPLE_TEAM_ID" && test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/desktop-signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/desktop-signing.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/desktop-signing.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/desktop-signing.keychain-db"
          security import "$RUNNER_TEMP/desktop-signing.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/desktop-signing.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/desktop-signing.keychain-db"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/desktop-signing.keychain-db"
      - name: Package application and installers
        env:
          ONW_DESKTOP_SIGN: ${{ inputs.signed && '1' || '0' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: cd desktop && npm run make
      - name: Verify standalone packaged application
        env:
          ONW_DESKTOP_UPDATES: '0'
        run: |
          cd desktop
          python3 -c 'from pathlib import Path; import subprocess; app = next(Path("out").glob("*/Open Net Worth.app/Contents/MacOS/open-net-worth")); subprocess.run(["node", "qa/packaged-smoke.mjs", str(app.resolve())], check=True)'
      - name: Verify Gatekeeper acceptance and stage release files
        if: inputs.signed == true
        run: |
          cd desktop
          app="$(find out -maxdepth 3 -type d -path '*/Open Net Worth.app' | head -1)"
          codesign --verify --deep --strict "$app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"
          version="$(node -p 'require("./package.json").version')"
          arch="$(node -p 'process.arch')"
          mkdir -p out/release
          # Stable DMG name for the landing page's /releases/latest/download/ link; the ZIP name
          # must contain -darwin-<arch> for update.electronjs.org to serve it to the updater.
          cp "$(find out/make -name '*.dmg' | head -1)" "out/release/Open-Net-Worth-mac-${arch}.dmg"
          cp "$(find out/make -name '*.zip' | head -1)" "out/release/Open-Net-Worth-darwin-${arch}-${version}.zip"
          ls -la out/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.signed == true
        with:
          name: desktop-release-${{ runner.arch }}
          path: desktop/out/release/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: desktop-macos-${{ runner.arch }}-${{ inputs.signed && 'signed' || 'unsigned' }}
          path: |
            desktop/out/make/
            desktop/qa/artifacts/
          retention-days: 7
          if-no-files-found: error
      - name: Remove temporary signing material
        if: always() && inputs.signed == true
        run: |
          security delete-keychain "$RUNNER_TEMP/desktop-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/desktop-signing.p12"

  windows:
    runs-on: windows-latest
    timeout-minutes: 75
    environment: desktop-release
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            frontend/package-lock.json
            docs-site/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install and check desktop host
        run: |
          python -m pip install -r requirements.txt
          export ONW_DESKTOP_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          cd desktop
          npm ci
          npm run typecheck
          npm test
      - name: Node and Python agree on file identity
        if: always()
        run: |
          export ONW_DESKTOP_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          cd desktop && node qa/identity-check.mjs
      - name: Installer script (Pester)
        shell: pwsh
        run: Invoke-Pester -Path scripts/install.Tests.ps1 -CI
      - name: Build relocatable runtime
        run: python scripts/build_desktop_runtime.py
      - name: Prepare Windows signing
        id: signing
        if: inputs.signed == true
        env:
          CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          AZURE_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          if [ -n "$AZURE_ENDPOINT" ] && [ -n "$AZURE_ACCOUNT" ] && [ -n "$AZURE_PROFILE" ] && [ -n "$AZURE_TENANT_ID" ] && [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_CLIENT_SECRET" ]; then
            nuget install Microsoft.Trusted.Signing.Client -Version 1.0.60 -OutputDirectory "$RUNNER_TEMP/signing" -NonInteractive
            dlib="$(find "$RUNNER_TEMP/signing" -path '*bin/x64/Azure.CodeSigning.Dlib.dll' | head -1)"
            test -n "$dlib"
            printf '{"Endpoint":"%s","CodeSigningAccountName":"%s","CertificateProfileName":"%s"}' "$AZURE_ENDPOINT" "$AZURE_ACCOUNT" "$AZURE_PROFILE" > "$RUNNER_TEMP/signing/metadata.json"
            {
              echo "ONW_DESKTOP_WINDOWS_SIGN=1"
              echo "WINDOWS_SIGN_WITH_PARAMS=/v /debug /dlib $(cygpath -w "$dlib") /dmdf $(cygpath -w "$RUNNER_TEMP/signing/metadata.json")"
              echo "WINDOWS_TIMESTAMP_SERVER=http://timestamp.acs.microsoft.com"
              echo "AZURE_TENANT_ID=$AZURE_TENANT_ID"
              echo "AZURE_CLIENT_ID=$AZURE_CLIENT_ID"
              echo "AZURE_CLIENT_SECRET=$AZURE_CLIENT_SECRET"
            } >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$CERTIFICATE" ] && [ -n "$CERTIFICATE_PASSWORD" ]; then
            printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/windows-signing.pfx"
            {
              echo "ONW_DESKTOP_WINDOWS_SIGN=1"
              echo "WINDOWS_CERTIFICATE_FILE=$(cygpath -w "$RUNNER_TEMP/windows-signing.pfx")"
              echo "WINDOWS_CERTIFICATE_PASSWORD=$CERTIFICATE_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No Windows signing credentials (WINDOWS_CERTIFICATE_BASE64 + WINDOWS_CERTIFICATE_PASSWORD, or the AZURE_TRUSTED_SIGNING_* and AZURE_* secrets): building an UNSIGNED installer."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Package application and installer
        run: cd desktop && npm run make
      - name: Install with scripts/install.ps1 and smoke the installed app
        shell: pwsh
        env:
          ONW_DESKTOP_UPDATES: '0'
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'onw-setup'
          New-Item -ItemType Directory -Path $dir | Out-Null
          Copy-Item (Get-ChildItem desktop/out/make -Recurse -Filter 'Open-Net-Worth-windows-x64-setup.exe').FullName $dir
          $hash = (Get-FileHash (Join-Path $dir 'Open-Net-Worth-windows-x64-setup.exe') -Algorithm SHA256).Hash.ToLower()
          "$hash  Open-Net-Worth-windows-x64-setup.exe" | Set-Content (Join-Path $dir 'SHA256SUMS')
          if ($env:SIGNED -eq 'true') { ./scripts/install.ps1 -SourceDirectory $dir } else { ./scripts/install.ps1 -SourceDirectory $dir -AllowUnsigned }
          Start-Sleep -Seconds 10
          Get-Process open-net-worth -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 5
          $exe = (Get-ChildItem "$env:LOCALAPPDATA\OpenNetWorth" -Recurse -Filter open-net-worth.exe | Select-Object -First 1).FullName
          Write-Host "installed: $exe"
          Push-Location desktop
          node qa/packaged-smoke.mjs $exe
          Pop-Location
      - name: Verify signature and stage release files
        if: inputs.signed == true
        shell: pwsh
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          ALLOW_UNSIGNED: ${{ vars.ALLOW_UNSIGNED_WINDOWS_RELEASE }}
        run: |
          $make = (Get-ChildItem desktop/out/make/squirrel.windows -Directory | Select-Object -First 1).FullName
          if ($env:SIGNED -eq 'true') {
            foreach ($f in Get-ChildItem $make -Filter *.exe) {
              $status = (Get-AuthenticodeSignature $f.FullName).Status
              if ($status -ne 'Valid') { throw "$($f.Name) signature is $status" }
            }
          } elseif ($env:ALLOW_UNSIGNED -ne 'true') {
            Write-Host "::warning::Windows installer is unsigned and repository variable ALLOW_UNSIGNED_WINDOWS_RELEASE is not 'true': NOT staging it for release."
            exit 0
          }
          $out = 'desktop/out/release'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          # Stable installer name for the landing page and install.ps1. RELEASES + the full .nupkg
          # keep their Squirrel names: RELEASES names the package, and update.electronjs.org
          # rewrites that name to the release asset URL.
          Copy-Item (Join-Path $make 'Open-Net-Worth-windows-x64-setup.exe') $out
          Copy-Item (Join-Path $make 'RELEASES') $out
          Copy-Item (Get-ChildItem $make -Filter *-full.nupkg).FullName $out
          Copy-Item scripts/install.ps1 $out
          Get-ChildItem $out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.signed == true
        with:
          name: desktop-release-windows-x64
          path: desktop/out/release/
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: desktop-windows-x64-${{ inputs.signed && 'signed' || 'unsigned' }}
          path: |
            desktop/out/make/
            desktop/qa/artifacts/
          retention-days: 7
          if-no-files-found: warn
      - name: Remove temporary signing material
        if: always() && inputs.signed == true
        run: rm -f "$RUNNER_TEMP/windows-signing.pfx"

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            frontend/package-lock.json
            docs-site/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb fakeroot dpkg libgtk-3-0t64 libnss3 libgbm1 libasound2t64 libxss1 libxtst6 libatspi2.0-0t64 libsecret-1-0 libnotify4
      - name: Install and check desktop host
        run: |
          export ONW_DESKTOP_PYTHON="$(command -v python3)"
          cd desktop
          npm ci
          npm run typecheck
          npm test
      - name: Check the terminal installer
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest tests/test_install_desktop_script.py -q --noconftest -p no:cacheprovider
      - name: Build relocatable runtime
        run: python3 scripts/build_desktop_runtime.py
      - name: Exercise Electron with bundled runtime and disposable book
        # Runs for signed (release) builds too: a release re-proves the exact commit it ships.
        run: |
          cd desktop
          npm run build
          export ONW_DESKTOP_RUNTIME="$PWD/runtime"
          xvfb-run -a npm run e2e
          xvfb-run -a node qa/default-book.mjs
          xvfb-run -a node qa/book-picker.mjs
          xvfb-run -a node qa/close.mjs
          npx playwright install --with-deps chromium
          xvfb-run -a node qa/browser.mjs
          # qa/server-client.mjs is not run on Linux yet: it already fails on macOS main and closes
          # the app on Escape in the activity prompt on Linux (follow-up).
      - name: Package AppImage and .deb
        run: cd desktop && npm run make
      - name: Verify the packaged AppImage
        run: |
          cd desktop
          xvfb-run -a node qa/packaged-smoke-linux.mjs "$(realpath "$(find out/make -name '*.AppImage' | head -1)")"
      - name: Verify the .deb installs with a working sandbox
        run: |
          cd desktop
          sudo apt-get install -y "$(realpath "$(find out/make -name '*.deb' | head -1)")"
          test "$(stat -c %a /usr/lib/open-net-worth/chrome-sandbox)" = 4755
          test -f /usr/share/applications/open-net-worth.desktop
          xvfb-run -a node qa/packaged-smoke-linux.mjs /usr/lib/open-net-worth/open-net-worth
      - name: Stage release files
        run: |
          cd desktop
          mkdir -p out/release
          # Stable names for the landing page's /releases/latest/download/ links. The publisher adds
          # install.sh and one SHA256SUMS covering every desktop asset.
          cp "$(find out/make -name '*.AppImage' | head -1)" out/release/Open-Net-Worth-linux-x86_64.AppImage
          cp "$(find out/make -name '*.deb' | head -1)" out/release/Open-Net-Worth-linux-amd64.deb
          ls -la out/release
      - name: Install the staged AppImage with the terminal installer
        run: |
          mkdir -p "$RUNNER_TEMP/served"
          cp desktop/out/release/* "$RUNNER_TEMP/served/"
          (cd "$RUNNER_TEMP/served" && sha256sum -- * > SHA256SUMS)
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/served" >/dev/null 2>&1 &
          sleep 1
          export HOME="$RUNNER_TEMP/installer-home"
          mkdir -p "$HOME"
          export ONW_RELEASE_BASE_URL=http://127.0.0.1:8765
          sh scripts/install-desktop.sh
          test -x "$HOME/.local/bin/open-net-worth"
          grep -q '^Exec=' "$HOME/.local/share/applications/open-net-worth.desktop"
          test -s "$HOME/.local/share/icons/hicolor/512x512/apps/open-net-worth.png"
          sh scripts/install-desktop.sh --uninstall
          test ! -e "$HOME/.local/bin/open-net-worth"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.signed == true
        with:
          name: desktop-release-linux-x64
          path: desktop/out/release/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: desktop-linux-x64-${{ inputs.signed && 'release' || 'check' }}
          path: |
            desktop/out/make/
            desktop/qa/artifacts/
          retention-days: 7
          if-no-files-found: ignore
