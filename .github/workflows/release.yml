name: Release

# The AUTOMATED release pipeline, dormant until this repo's Actions run again (the account's
# billing/spending limit; RELEASING.md). Until then the same release is made by the public
# open-net-worth-releases repo's release.yml, which checks this repo out and runs the same
# scripts - keep the two in step. One path at a time: never run both for a version.
#
# Trigger: push a `vX.Y.Z` tag on the commit `make release-commit VERSION=X.Y.Z` made (and CI
# passed on). Jobs: version check -> gate (tests against the known-failure baselines, security
# scan, desktop tests) -> build (desktop x3, agent image amd64+arm64, wheel) -> DRAFT release in
# the public releases repo with manifest.json + SHA256SUMS signed with minisign -> verify by
# download -> `promote` behind the `release` environment (manual approval), which marks it latest,
# moves the image's latest/X.Y tags and publishes the wheel to PyPI when enabled.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/open-net-worth-ai/open-net-worth
  RELEASES_REPO: open-net-worth-ai/open-net-worth-releases

jobs:
  version:
    name: tag matches every stamped version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      litellm_ref: ${{ steps.version.outputs.litellm_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME#v}"
          py="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          desktop="$(python3 -c 'import json; print(json.load(open("desktop/package.json"))["version"])')"
          if [ "$py" != "$tag" ] || [ "$desktop" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME must match pyproject.toml ($py) and desktop/package.json ($desktop)"
            exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main; releases are cut from main"; exit 1; }
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "litellm_ref=$(gh api repos/BerriAI/litellm/commits/main --jq .sha)" >> "$GITHUB_OUTPUT"

  gate-backend:
    name: gate - backend tests
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install backend deps
        run: python3 -m pip install -q -r requirements.txt -r requirements-dev.txt > "$RUNNER_TEMP/pip.log" 2>&1 || { tail -20 "$RUNNER_TEMP/pip.log"; exit 1; }
      - name: pytest, failing only on tests outside tests/known_failures.txt
        run: |
          python3 -m pytest -q -m "not integration" --tb=no -p no:cacheprovider --junitxml="$RUNNER_TEMP/junit.xml" > "$RUNNER_TEMP/pytest.log" 2>&1 || true
          tail -1 "$RUNNER_TEMP/pytest.log"
          python3 scripts/gate_baseline.py pytest "$RUNNER_TEMP/junit.xml" tests/known_failures.txt

  gate-frontend:
    name: gate - frontend tests
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: vitest, failing only on tests outside frontend/known_failures.txt
        working-directory: frontend
        run: |
          npm ci --silent --no-audit --no-fund > /dev/null 2>&1
          # Generated, gitignored inputs the tests import (design tokens, entity registry).
          npm run prebuild > /dev/null 2>&1
          npx vitest run --reporter=json --outputFile="$RUNNER_TEMP/vitest.json" > "$RUNNER_TEMP/vitest.log" 2>&1 || true
          python3 ../scripts/gate_baseline.py vitest "$RUNNER_TEMP/vitest.json" known_failures.txt

  security:
    name: gate - security scan
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python3 -m pip install -q pip-audit semgrep bandit > /dev/null 2>&1
      - name: pip-audit, npm audit, semgrep, bandit
        run: scripts/security_scan.sh

  wheel:
    name: build wheel + sdist
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Refresh model prices
        env:
          ONW_LITELLM_REF: ${{ needs.version.outputs.litellm_ref }}
        run: python3 scripts/refresh_model_prices.py
      - name: Build frontend + docs site, bundle, uv build
        run: |
          (cd frontend && npm ci --silent && npm run build) > "$RUNNER_TEMP/build.log" 2>&1 || { tail -30 "$RUNNER_TEMP/build.log"; exit 1; }
          (cd docs-site && npm ci --silent && npm run build:embed) >> "$RUNNER_TEMP/build.log" 2>&1 || { tail -30 "$RUNNER_TEMP/build.log"; exit 1; }
          python3 scripts/bundle_assets.py > /dev/null
          uv build > /dev/null
          ls dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 3
          if-no-files-found: error

  image:
    name: agent image (amd64 + arm64)
    needs: [version, gate-backend, gate-frontend, security]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Refresh model prices
        env:
          ONW_LITELLM_REF: ${{ needs.version.outputs.litellm_ref }}
        run: python3 scripts/refresh_model_prices.py
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build the amd64 image and boot it
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: onw-release-smoke:amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
      - name: The image reports the release version and its contracts
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          docker run -d --name onw -e AUTH_PASSWORD=ci -p 127.0.0.1:8080:8080 onw-release-smoke:amd64 > /dev/null
          for _ in $(seq 1 90); do curl -fsS http://127.0.0.1:8080/api/health > health.json 2>/dev/null && break; sleep 1; done
          cat health.json
          python3 - <<'PY'
          import json, os
          body = json.load(open("health.json"))
          assert body["version"] == os.environ["VERSION"], f"image reports {body['version']}"
          assert body["contracts"] == {"gateway": 1, "move": 1}, body["contracts"]
          PY
          docker rm -f onw > /dev/null
      - name: Push the multi-arch image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ needs.version.outputs.version }}
          # Links the package to this PUBLIC repo, not the private source.
          labels: |
            org.opencontainers.image.source=https://github.com/open-net-worth-ai/open-net-worth-releases
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          provenance: false

  desktop:
    name: desktop apps (signed, tested on every platform)
    needs: version
    uses: ./.github/workflows/desktop.yml
    with:
      signed: true
    secrets: inherit

  draft:
    name: manifest, signatures and DRAFT release
    needs: [version, gate-backend, gate-frontend, security, wheel, image, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.ONW_RELEASES_TOKEN }}
      VERSION: ${{ needs.version.outputs.version }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-release-*
          path: release/
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Assemble, write manifest.json + SHA256SUMS, sign, upload as a draft
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
          ONW_MINISIGN_SECRET_KEY: ${{ secrets.ONW_MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          cp dist/*.whl dist/*.tar.gz release/
          cp scripts/install.sh release/install-server.sh
          cp docker-compose.yml release/docker-compose.yml
          sudo apt-get install -y -qq --no-install-recommends minisign > /dev/null
          python3 scripts/release_manifest.py generate --version "$VERSION" --commit "$SHA" --image-digest "$DIGEST" --assets release
          scripts/release_sign.sh "$VERSION" release
          ls -la release
          scripts/release_draft.sh "$VERSION" release "$SHA"

  verify:
    name: verify the draft
    needs: [version, image, draft]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      GH_TOKEN: ${{ secrets.ONW_RELEASES_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - run: sudo apt-get install -y -qq --no-install-recommends minisign > /dev/null
      - name: Download the draft and check signatures, checksums, manifest and image
        run: scripts/release_verify.sh "${{ needs.version.outputs.version }}"

  promote:
    name: promote to latest (manual approval)
    needs: [version, image, verify]
    runs-on: ubuntu-latest
    # Required reviewers on this environment are the gate: nothing below runs until the owner
    # approves, after reading the verify job. Promotion is the one step desktop updates cannot undo.
    environment: release
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ secrets.ONW_RELEASES_TOKEN }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Publish the draft as the latest release
        run: scripts/release_promote.sh "$VERSION"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Move the image's X.Y and latest tags to this release
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          minor="${VERSION%.*}"
          docker buildx imagetools create -t "$IMAGE:$minor" -t "$IMAGE:latest" "$IMAGE@$DIGEST"
      - name: PyPI status
        env:
          PYPI_PUBLISH: ${{ vars.PYPI_PUBLISH }}
        run: |
          if [ "$PYPI_PUBLISH" != true ]; then
            echo "::notice::PyPI publishing is off. After registering the release workflow (environment pypi) as a trusted publisher, set the repository variable PYPI_PUBLISH=true and re-run only the pypi job, or publish the wheel from the release by hand. install-server.sh tells users where to go meanwhile."
          fi
      - name: Update feed offers the new version
        continue-on-error: true
        run: |
          sleep 60
          for feed in darwin-arm64 win32-x64; do
            body="$(curl -fsS "https://update.electronjs.org/$RELEASES_REPO/$feed/0.0.1" || true)"
            echo "$feed: $body"
            echo "$body" | grep -q "$VERSION" || echo "::warning::$feed feed does not list $VERSION yet (its cache refreshes within minutes)"
          done

  pypi:
    name: publish to PyPI
    needs: [version, promote]
    if: ${{ vars.PYPI_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/open-net-worth/${{ needs.version.outputs.version }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
